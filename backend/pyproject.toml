[project]
name = "techbold-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.7.1",
    "httpx>=0.28.0",
    "paramiko>=3.5.0",
    "anthropic>=0.43.0",
    "python-dotenv>=1.0.0",
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run tests with: PYTHONPATH=. uv run pytest
# (overrides the ROS-polluted PYTHONPATH from the dev environment)
